<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Go Music Player</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --bg: #0A0A0A;
      --darker: #121212;
      --primary: #8B5CF6;
      --secondary: #EC4899;
      --accent: #8B5CF6;
      --muted: #9CA3AF;
      --logo: #FAFAFA;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    html,body{
      height:100%;
      margin:0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, var(--bg) 50%, #0f0f0f 100%);
      color:var(--logo);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow: hidden;
    }

    /* Animated background particles */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 20s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) translateX(0px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-100px) translateX(100px) rotate(360deg); opacity: 0; }
    }

    /* Splash container */
    #splash {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:32px;
      z-index:9999;
      transition:opacity .8s ease, transform .8s ease;
      will-change:opacity, transform;
      background: 
        radial-gradient(800px 400px at 20% 30%, rgba(139, 92, 246, 0.08), transparent 40%),
        radial-gradient(600px 300px at 80% 70%, rgba(236, 72, 153, 0.06), transparent 40%),
        radial-gradient(1000px 500px at 50% 50%, rgba(139, 92, 246, 0.03), transparent 50%);
    }

    /* Logo card with glassmorphism */
    .splash-card{
      display:flex;
      align-items:center;
      gap:24px;
      padding:32px 40px;
      border-radius:20px;
      background: linear-gradient(135deg, var(--glass), rgba(255,255,255,0.02));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(139, 92, 246, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transform:translateY(0);
      animation: cardPop 1s cubic-bezier(.2,.9,.3,1);
      position: relative;
      overflow: hidden;
    }

    /* Animated border gradient */
    .splash-card::before {
      content: '';
      position: absolute;
      inset: 0;
      padding: 2px;
      background: linear-gradient(45deg, var(--primary), var(--secondary), var(--primary));
      border-radius: inherit;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: xor;
      -webkit-mask-composite: xor;
      opacity: 0.3;
      animation: borderGlow 3s ease-in-out infinite alternate;
    }

    @keyframes borderGlow {
      0% { opacity: 0.3; filter: hue-rotate(0deg); }
      100% { opacity: 0.6; filter: hue-rotate(90deg); }
    }

    @keyframes cardPop{
      from { transform: translateY(20px) scale(.95); opacity:0; }
      to   { transform: translateY(0) scale(1); opacity:1; }
    }

    /* Music icon with enhanced styling */
    .music-icon {
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 20px;
      box-shadow: 
        0 10px 30px rgba(139, 92, 246, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      position: relative;
      animation: iconPulse 2.5s ease-in-out infinite;
    }

    .music-icon::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(45deg, var(--primary), var(--secondary), var(--primary));
      border-radius: 22px;
      z-index: -1;
      opacity: 0.5;
      animation: iconGlow 2s ease-in-out infinite alternate;
    }

    .music-icon i {
      font-size: 42px;
      color: white;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    @keyframes iconPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes iconGlow {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }

    /* Title styling */
    .title-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .title h1{
      font-size: 28px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--logo), var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title p{
      margin: 8px 0 0 0;
      font-size: 14px;
      color: var(--muted);
      font-weight: 400;
    }

    /* Enhanced equalizer bars */
    .eq {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      margin-left: 16px;
      padding: 8px;
      background: rgba(139, 92, 246, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .eq .bar{
      width: 8px;
      border-radius: 4px;
      transform-origin: bottom center;
      animation: bounce 1.2s infinite ease-in-out;
      background: linear-gradient(180deg, var(--secondary), var(--primary));
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
    }

    .eq .bar.b1 { animation-delay: 0s; height: 20px; }
    .eq .bar.b2 { animation-delay: 0.15s; height: 14px; }
    .eq .bar.b3 { animation-delay: 0.3s; height: 26px; }
    .eq .bar.b4 { animation-delay: 0.45s; height: 16px; }
    .eq .bar.b5 { animation-delay: 0.6s; height: 22px; }

    @keyframes bounce {
      0% { transform: scaleY(0.3); opacity: 0.6; }
      50% { transform: scaleY(1.0); opacity: 1; }
      100% { transform: scaleY(0.3); opacity: 0.6; }
    }

    /* Enhanced loading section */
    .loading-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loading {
      display: flex;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 16px;
      font-weight: 500;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dots span {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 50%;
      transform: translateY(0);
      animation: dotJump 1.2s infinite ease-in-out;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
    }

    .dots span:nth-child(1){ animation-delay: 0s; }
    .dots span:nth-child(2){ animation-delay: 0.2s; }
    .dots span:nth-child(3){ animation-delay: 0.4s; }

    @keyframes dotJump {
      0% { transform: translateY(0) scale(1); opacity: 0.7; }
      50% { transform: translateY(-12px) scale(1.1); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 0.7; }
    }

    /* Progress bar */
    .progress-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 2px;
      animation: progressFill 3s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
    }

    @keyframes progressFill {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    /* Responsive design */
    @media (max-width: 640px){
      .splash-card{ 
        padding: 24px 28px; 
        gap: 16px; 
        border-radius: 16px;
        margin: 0 20px;
      }
      
      .music-icon{ 
        width: 72px; 
        height: 72px;
        border-radius: 16px;
      }
      
      .music-icon i {
        font-size: 32px;
      }
      
      .title h1{ font-size: 22px; }
      .title p{ font-size: 13px; }
      
      .eq {
        margin-left: 8px;
        padding: 6px;
      }
      
      .eq .bar {
        width: 6px;
      }
      
      #splash {
        gap: 24px;
      }
    }

    /* Fade out animation */
    .fade-out {
      opacity: 0;
      transform: translateY(-20px) scale(0.98);
    }
  </style>
</head>
<body>
  <!-- Background particles -->
  <div class="bg-particles" id="particles"></div>

  <!-- SPLASH -->
  <div id="splash" role="status" aria-live="polite">
    <div class="splash-card" aria-hidden="false">
      <!-- Music Icon -->
      <div class="music-icon">
        <i class="fas fa-music"></i>
      </div>

      <!-- Title Section -->
      <div class="title-section">
        <div class="title">
          <h1>Go Music Player</h1>
          <p id="sub">Initializing your music experience...</p>
        </div>
      </div>

      <!-- Animated equalizer -->
      <div class="eq" aria-hidden="true">
        <div class="bar b1"></div>
        <div class="bar b2"></div>
        <div class="bar b3"></div>
        <div class="bar b4"></div>
        <div class="bar b5"></div>
      </div>
    </div>

    <!-- Loading section -->
    <div class="loading-section">
      <div class="loading" aria-hidden="true">
        <span>Loading</span>
        <div class="dots">
          <span></span><span></span><span></span>
        </div>
      </div>
      
      <!-- Progress bar -->
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Create floating particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 15;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        // Random starting position and timing
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (15 + Math.random() * 10) + 's';
        
        // Random color variation
        if (Math.random() > 0.5) {
          particle.style.background = 'var(--secondary)';
        }
        
        particlesContainer.appendChild(particle);
      }
    }

    // Update loading text
    const loadingTexts = [
      'Initializing your music experience...',
      'Scanning music library...',
      'Preparing audio engine...',
      'Almost ready...'
    ];

    let currentTextIndex = 0;
    const subElement = document.getElementById('sub');

    function updateLoadingText() {
      if (currentTextIndex < loadingTexts.length) {
        subElement.textContent = loadingTexts[currentTextIndex];
        currentTextIndex++;
        setTimeout(updateLoadingText, 1000);
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      createParticles();
      setTimeout(updateLoadingText, 500);
      
      // Listen for splash-done event from Go application
      if (typeof window.wails !== 'undefined') {
        window.wails.Events.On("splash-done", () => {
          document.getElementById('splash').classList.add('fade-out');
          // Hide splash screen and show main app
          setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
          }, 800);
        });
      } else {
        // Auto-hide splash after 4 seconds for demo/testing
        setTimeout(() => {
          document.getElementById('splash').classList.add('fade-out');
          // Hide splash screen and show main app
          setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
          }, 800);
        }, 4000);
      }
    });
  </script>
</body>
</html>
