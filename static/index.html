<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Music Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8B5CF6',
                        secondary: '#EC4899',
                        dark: '#121212',
                        darker: '#0A0A0A',
                        light: '#FAFAFA'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .song-button {
            transition: all 0.3s ease;
        }
        .song-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .playing {
            background: linear-gradient(90deg, #8B5CF6, #EC4899);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #8B5CF6;
            cursor: pointer;
        }
        .progress-bar::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #8B5CF6;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #EC4899;
            cursor: pointer;
        }
        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #EC4899;
            cursor: pointer;
        }
        
        /* Splash screen styles */
        :root{
          --bg: #0A0A0A;
          --darker: #121212;
          --primary: #8B5CF6;
          --secondary: #EC4899;
          --accent: #8B5CF6;
          --muted: #9CA3AF;
          --logo: #FAFAFA;
          --glass: rgba(255, 255, 255, 0.05);
          --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* Animated background particles */
        .bg-particles {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 1;
        }

        .particle {
          position: absolute;
          width: 2px;
          height: 2px;
          background: var(--primary);
          border-radius: 50%;
          opacity: 0.3;
          animation: float 20s infinite linear;
        }

        @keyframes float {
          0% { transform: translateY(100vh) translateX(0px) rotate(0deg); opacity: 0; }
          10% { opacity: 0.3; }
          90% { opacity: 0.3; }
          100% { transform: translateY(-100px) translateX(100px) rotate(360deg); opacity: 0; }
        }

        /* Splash container */
        #splash {
          position:fixed;
          inset:0;
          display:flex;
          align-items:center;
          justify-content:center;
          flex-direction:column;
          gap:32px;
          z-index:9999;
          transition:opacity .8s ease, transform .8s ease;
          will-change:opacity, transform;
          background: 
            radial-gradient(800px 400px at 20% 30%, rgba(139, 92, 246, 0.08), transparent 40%),
            radial-gradient(600px 300px at 80% 70%, rgba(236, 72, 153, 0.06), transparent 40%),
            radial-gradient(1000px 500px at 50% 50%, rgba(139, 92, 246, 0.03), transparent 50%);
        }

        /* Logo card with glassmorphism */
        .splash-card{
          display:flex;
          align-items:center;
          gap:24px;
          padding:32px 40px;
          border-radius:20px;
          background: linear-gradient(135deg, var(--glass), rgba(255,255,255,0.02));
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 1px solid var(--glass-border);
          box-shadow: 
            0 8px 32px rgba(0, 0, 0, 0.4),
            0 0 0 1px rgba(139, 92, 246, 0.1),
            inset 0 1px 0 rgba(255, 255, 255, 0.1);
          transform:translateY(0);
          animation: cardPop 1s cubic-bezier(.2,.9,.3,1);
          position: relative;
          overflow: hidden;
        }

        /* Animated border gradient */
        .splash-card::before {
          content: '';
          position: absolute;
          inset: 0;
          padding: 2px;
          background: linear-gradient(45deg, var(--primary), var(--secondary), var(--primary));
          border-radius: inherit;
          mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          mask-composite: xor;
          -webkit-mask-composite: xor;
          opacity: 0.3;
          animation: borderGlow 3s ease-in-out infinite alternate;
        }

        @keyframes borderGlow {
          0% { opacity: 0.3; filter: hue-rotate(0deg); }
          100% { opacity: 0.6; filter: hue-rotate(90deg); }
        }

        @keyframes cardPop{
          from { transform: translateY(20px) scale(.95); opacity:0; }
          to   { transform: translateY(0) scale(1); opacity:1; }
        }

        /* Music icon with enhanced styling */
        .music-icon {
          width: 96px;
          height: 96px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, var(--primary), var(--secondary));
          border-radius: 20px;
          box-shadow: 
            0 10px 30px rgba(139, 92, 246, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
          position: relative;
          animation: iconPulse 2.5s ease-in-out infinite;
        }

        .music-icon::before {
          content: '';
          position: absolute;
          inset: -2px;
          background: linear-gradient(45deg, var(--primary), var(--secondary), var(--primary));
          border-radius: 22px;
          z-index: -1;
          opacity: 0.5;
          animation: iconGlow 2s ease-in-out infinite alternate;
        }

        .music-icon i {
          font-size: 42px;
          color: white;
          text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        @keyframes iconPulse {
          0% { transform: scale(1); }
          50% { transform: scale(1.05); }
          100% { transform: scale(1); }
        }

        @keyframes iconGlow {
          0% { opacity: 0.5; transform: scale(1); }
          100% { opacity: 0.8; transform: scale(1.05); }
        }

        /* Title styling */
        .title-section {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }

        .title h1{
          font-size: 28px;
          margin: 0;
          font-weight: 700;
          letter-spacing: -0.5px;
          background: linear-gradient(135deg, var(--logo), var(--muted));
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        .title p{
          margin: 8px 0 0 0;
          font-size: 14px;
          color: var(--muted);
          font-weight: 400;
        }

        /* Enhanced equalizer bars */
        .eq {
          display: flex;
          gap: 6px;
          align-items: flex-end;
          margin-left: 16px;
          padding: 8px;
          background: rgba(139, 92, 246, 0.1);
          border-radius: 12px;
          backdrop-filter: blur(10px);
        }

        .eq .bar{
          width: 8px;
          border-radius: 4px;
          transform-origin: bottom center;
          animation: bounce 1.2s infinite ease-in-out;
          background: linear-gradient(180deg, var(--secondary), var(--primary));
          box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }

        .eq .bar.b1 { animation-delay: 0s; height: 20px; }
        .eq .bar.b2 { animation-delay: 0.15s; height: 14px; }
        .eq .bar.b3 { animation-delay: 0.3s; height: 26px; }
        .eq .bar.b4 { animation-delay: 0.45s; height: 16px; }
        .eq .bar.b5 { animation-delay: 0.6s; height: 22px; }

        @keyframes bounce {
          0% { transform: scaleY(0.3); opacity: 0.6; }
          50% { transform: scaleY(1.0); opacity: 1; }
          100% { transform: scaleY(0.3); opacity: 0.6; }
        }

        /* Enhanced loading section */
        .loading-section {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
        }

        .loading {
          display: flex;
          gap: 12px;
          align-items: center;
          color: var(--muted);
          font-size: 16px;
          font-weight: 500;
        }

        .dots {
          display: flex;
          gap: 8px;
        }

        .dots span {
          display: inline-block;
          width: 10px;
          height: 10px;
          background: linear-gradient(135deg, var(--primary), var(--secondary));
          border-radius: 50%;
          transform: translateY(0);
          animation: dotJump 1.2s infinite ease-in-out;
          box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }

        .dots span:nth-child(1){ animation-delay: 0s; }
        .dots span:nth-child(2){ animation-delay: 0.2s; }
        .dots span:nth-child(3){ animation-delay: 0.4s; }

        @keyframes dotJump {
          0% { transform: translateY(0) scale(1); opacity: 0.7; }
          50% { transform: translateY(-12px) scale(1.1); opacity: 1; }
          100% { transform: translateY(0) scale(1); opacity: 0.7; }
        }

        /* Progress bar */
        .progress-container {
          width: 200px;
          height: 4px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 2px;
          overflow: hidden;
          backdrop-filter: blur(10px);
        }

        .progress-bar {
          height: 100%;
          background: linear-gradient(90deg, var(--primary), var(--secondary));
          border-radius: 2px;
          animation: progressFill 3s ease-in-out infinite;
          box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
        }

        @keyframes progressFill {
          0% { width: 0%; }
          50% { width: 70%; }
          100% { width: 100%; }
        }

        /* Responsive design */
        @media (max-width: 640px){
          .splash-card{ 
            padding: 24px 28px; 
            gap: 16px; 
            border-radius: 16px;
            margin: 0 20px;
          }
          
          .music-icon{ 
            width: 72px; 
            height: 72px;
            border-radius: 16px;
          }
          
          .music-icon i {
            font-size: 32px;
          }
          
          .title h1{ font-size: 22px; }
          .title p{ font-size: 13px; }
          
          .eq {
            margin-left: 8px;
            padding: 6px;
          }
          
          .eq .bar {
            width: 6px;
          }
          
          #splash {
            gap: 24px;
          }
        }

        /* Fade out animation */
        .fade-out {
          opacity: 0;
          transform: translateY(-20px) scale(0.98);
        }
        
        /* Hide main content initially */
        .main-content {
          display: none;
        }
    </style>
</head>
<body class="text-light">
    <!-- Background particles -->
    <div class="bg-particles" id="particles"></div>

    <!-- SPLASH -->
    <div id="splash" role="status" aria-live="polite">
        <div class="splash-card" aria-hidden="false">
          <!-- Music Icon -->
          <div class="music-icon">
            <i class="fas fa-music"></i>
          </div>

          <!-- Title Section -->
          <div class="title-section">
            <div class="title">
              <h1>Go Music Player</h1>
              <p id="sub">Initializing your music experience...</p>
            </div>
          </div>

          <!-- Animated equalizer -->
          <div class="eq" aria-hidden="true">
            <div class="bar b1"></div>
            <div class="bar b2"></div>
            <div class="bar b3"></div>
            <div class="bar b4"></div>
            <div class="bar b5"></div>
          </div>
        </div>

        <!-- Loading section -->
        <div class="loading-section">
          <div class="loading" aria-hidden="true">
            <span>Loading</span>
            <div class="dots">
              <span></span><span></span><span></span>
            </div>
          </div>
          
          <!-- Progress bar -->
          <div class="progress-container">
            <div class="progress-bar"></div>
          </div>
        </div>
    </div>

    <!-- Main Content (hidden initially) -->
    <div class="main-content">
        <div class="container mx-auto px-4 py-8">
            <!-- Header -->
            <header class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent mb-2">
                    <i class="fas fa-music mr-3"></i>Go Music Player
                </h1>
                <p class="text-gray-400">Stream your favorite songs directly from your local collection</p>
            </header>

            <!-- Main Content -->
            <div class="flex flex-col lg:flex-row gap-8">
                <!-- Song List Section -->
                <div class="lg:w-2/3">
                    <div class="bg-darker rounded-2xl p-6 shadow-2xl">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold flex items-center">
                                <i class="fas fa-list mr-2 text-primary"></i>Song Library
                            </h2>
                            <div class="relative">
                                <input type="text" id="search-input" placeholder="Search songs..." 
                                    class="bg-gray-900 text-white rounded-full py-2 px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-primary w-40 md:w-64">
                                <i class="fas fa-search absolute left-3 top-3 text-gray-500"></i>
                            </div>
                        </div>

                        <div id="song-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                            <div class="text-center py-10 text-gray-500">
                                <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                                <p>Loading songs...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Player Section -->
                <div class="lg:w-1/3">
                    <div class="bg-darker rounded-2xl p-6 shadow-2xl sticky top-6">
                        <h2 class="text-2xl font-bold mb-6 text-center flex items-center justify-center">
                            <i class="fas fa-compact-disc mr-2 text-primary"></i>Now Playing
                        </h2>
                        
                        <!-- Album Art Placeholder -->
                        <div class="bg-gradient-to-br from-primary/20 to-secondary/20 rounded-xl p-8 mb-6 flex items-center justify-center">
                            <div class="bg-gray-800 rounded-full w-48 h-48 flex items-center justify-center">
                                <i class="fas fa-music text-6xl text-gray-600"></i>
                            </div>
                        </div>

                        <!-- Song Info -->
                        <div class="text-center mb-6">
                            <h3 id="current-song-title" class="text-xl font-bold truncate">No song selected</h3>
                            <p id="current-song-artist" class="text-gray-400">Select a song to play</p>
                        </div>

                        <!-- Progress Bar -->
                        <div class="mb-4">
                            <div class="flex justify-between text-sm text-gray-400 mb-1">
                                <span id="current-time">0:00</span>
                                <span id="total-time">0:00</span>
                            </div>
                            <input type="range" id="progress-bar" class="progress-bar w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer" 
                                value="0" min="0" max="100">
                        </div>

                        <!-- Player Controls -->
                        <div class="flex justify-center items-center space-x-6 mb-6">
                            <button id="shuffle-btn" class="text-gray-400 hover:text-white">
                                <i class="fas fa-random text-xl"></i>
                            </button>
                            <button id="prev-btn" class="text-gray-400 hover:text-white">
                                <i class="fas fa-step-backward text-xl"></i>
                            </button>
                            <button id="play-btn" class="bg-primary hover:bg-purple-600 rounded-full w-14 h-14 flex items-center justify-center">
                                <i class="fas fa-play text-xl"></i>
                            </button>
                            <button id="next-btn" class="text-gray-400 hover:text-white">
                                <i class="fas fa-step-forward text-xl"></i>
                            </button>
                            <button id="repeat-btn" class="text-gray-400 hover:text-white">
                                <i class="fas fa-redo text-xl"></i>
                            </button>
                        </div>

                        <!-- Volume Control -->
                        <div class="flex items-center space-x-3">
                            <i class="fas fa-volume-down text-gray-400"></i>
                            <input type="range" id="volume-slider" class="volume-slider w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer" 
                                value="80" min="0" max="100">
                            <i class="fas fa-volume-up text-gray-400"></i>
                        </div>

                        <!-- Hidden Audio Element -->
                        <audio id="audio-player" class="hidden"></audio>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer class="mt-12 text-center text-gray-500 text-sm">
                <p>Go Music Player &copy; 2025 | Built with Go and Tailwind CSS</p>
            </footer>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
          const particlesContainer = document.getElementById('particles');
          const particleCount = 15;
          
          for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            // Random starting position and timing
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            
            // Random color variation
            if (Math.random() > 0.5) {
              particle.style.background = 'var(--secondary)';
            }
            
            particlesContainer.appendChild(particle);
          }
        }

        // Update loading text
        const loadingTexts = [
          'Initializing your music experience...',
          'Scanning music library...',
          'Preparing audio engine...',
          'Almost ready...'
        ];

        let currentTextIndex = 0;
        const subElement = document.getElementById('sub');

        function updateLoadingText() {
          if (currentTextIndex < loadingTexts.length) {
            subElement.textContent = loadingTexts[currentTextIndex];
            currentTextIndex++;
            setTimeout(updateLoadingText, 1000);
          }
        }

        // Initialize splash screen
        document.addEventListener('DOMContentLoaded', () => {
          createParticles();
          setTimeout(updateLoadingText, 500);
          
          // Hide splash screen and show main content after 3 seconds
          setTimeout(() => {
            document.getElementById('splash').classList.add('fade-out');
            // Hide splash screen and show main content
            setTimeout(() => {
              document.getElementById('splash').style.display = 'none';
              document.querySelector('.main-content').style.display = 'block';
              // Now initialize the music player
              initializeMusicPlayer();
            }, 800);
          }, 3000);
        });
        
        // DOM elements
        const audioPlayer = document.getElementById('audio-player');
        const songListContainer = document.getElementById('song-list');
        const currentSongTitle = document.getElementById('current-song-title');
        const currentSongArtist = document.getElementById('current-song-artist');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeDisplay = document.getElementById('current-time');
        const totalTimeDisplay = document.getElementById('total-time');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');

        // State variables
        let songs = [];
        let currentSongIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;

        // Initialize music player after splash screen
        function initializeMusicPlayer() {
          loadSongs();
        }

        // Fetch and display songs
        async function loadSongs() {
            try {
                const response = await fetch('/songs');
                songs = await response.json();
                
                if (songs.length === 0) {
                    songListContainer.innerHTML = `
                        <div class="text-center py-10">
                            <i class="fas fa-music-slash text-4xl text-gray-600 mb-3"></i>
                            <p class="text-gray-500">No songs found</p>
                            <p class="text-gray-600 text-sm mt-2">Add MP3 files to the songs folder</p>
                        </div>
                    `;
                    return;
                }
                
                renderSongList(songs);
            } catch (error) {
                songListContainer.innerHTML = `
                    <div class="text-center py-10">
                        <i class="fas fa-exclamation-triangle text-4xl text-yellow-500 mb-3"></i>
                        <p class="text-gray-500">Error loading songs</p>
                        <p class="text-gray-600 text-sm mt-2">Make sure the server is running</p>
                    </div>
                `;
                console.error('Error loading songs:', error);
            }
        }

        // Render song list
        function renderSongList(songsToRender) {
            songListContainer.innerHTML = '';
            
            songsToRender.forEach((song, index) => {
                const songElement = document.createElement('div');
                songElement.className = `song-button bg-gray-900 hover:bg-gray-800 rounded-xl p-4 cursor-pointer flex items-center group ${currentSongIndex === index ? 'playing' : ''}`;
                songElement.innerHTML = `
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-primary to-secondary flex items-center justify-center mr-4">
                        <i class="fas fa-music text-white"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="font-medium truncate">${song.name}</h3>
                        <p class="text-gray-400 text-sm truncate">${song.file}</p>
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fas fa-play text-primary"></i>
                    </div>
                `;
                songElement.onclick = () => playSong(index);
                songListContainer.appendChild(songElement);
            });
        }

        // Play selected song
        function playSong(index) {
            // Update current song index
            currentSongIndex = index;
            
            // Set audio source to the selected song
            const song = songs[index];
            audioPlayer.src = `/song/${encodeURIComponent(song.file)}`;
            
            // Update UI
            currentSongTitle.textContent = song.name;
            currentSongArtist.textContent = song.file;
            
            // Play the song
            audioPlayer.play()
                .then(() => {
                    isPlaying = true;
                    updatePlayButton();
                    // Re-render song list to show playing state
                    renderSongList(songs);
                })
                .catch(error => {
                    console.error('Error playing song:', error);
                    currentSongTitle.textContent = 'Error playing song';
                    currentSongArtist.textContent = song.name;
                });
        }

        // Update play/pause button
        function updatePlayButton() {
            const playIcon = playBtn.querySelector('i');
            if (isPlaying) {
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
            } else {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
            }
        }

        // Format time (seconds to mm:ss)
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Update progress bar
        function updateProgress() {
            const { currentTime, duration } = audioPlayer;
            if (duration) {
                progressBar.value = (currentTime / duration) * 100;
                currentTimeDisplay.textContent = formatTime(currentTime);
                totalTimeDisplay.textContent = formatTime(duration);
            }
        }

        // Set progress (when user drags slider)
        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audioPlayer.duration;
            
            audioPlayer.currentTime = (clickX / width) * duration;
        }

        // Set volume
        function setVolume() {
            audioPlayer.volume = volumeSlider.value / 100;
        }

        // Toggle play/pause
        function togglePlay() {
            if (currentSongIndex === -1 && songs.length > 0) {
                // If no song is playing, play the first one
                playSong(0);
            } else {
                if (isPlaying) {
                    audioPlayer.pause();
                } else {
                    audioPlayer.play();
                }
                isPlaying = !isPlaying;
                updatePlayButton();
            }
        }

        // Play next song
        function playNext() {
            if (songs.length === 0) return;
            
            if (isShuffle) {
                // Play a random song (excluding current)
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * songs.length);
                } while (randomIndex === currentSongIndex && songs.length > 1);
                playSong(randomIndex);
            } else {
                // Play next song in order
                const nextIndex = (currentSongIndex + 1) % songs.length;
                playSong(nextIndex);
            }
        }

        // Play previous song
        function playPrev() {
            if (songs.length === 0) return;
            
            if (audioPlayer.currentTime > 3) {
                // If more than 3 seconds into song, restart current song
                audioPlayer.currentTime = 0;
            } else {
                // Play previous song
                const prevIndex = (currentSongIndex - 1 + songs.length) % songs.length;
                playSong(prevIndex);
            }
        }

        // Toggle shuffle
        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('text-primary', isShuffle);
        }

        // Toggle repeat
        function toggleRepeat() {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('text-primary', isRepeat);
            audioPlayer.loop = isRepeat;
        }

        // Filter songs based on search input
        function filterSongs() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredSongs = songs.filter(song => 
                song.name.toLowerCase().includes(searchTerm) || 
                song.file.toLowerCase().includes(searchTerm)
            );
            renderSongList(filteredSongs);
        }

        // Event Listeners for music player
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', () => {
            isPlaying = false;
            updatePlayButton();
            
            if (isRepeat) {
                audioPlayer.currentTime = 0;
                audioPlayer.play();
                isPlaying = true;
                updatePlayButton();
            } else {
                playNext();
            }
        });

        progressBar.addEventListener('click', setProgress);
        volumeSlider.addEventListener('input', setVolume);
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', playPrev);
        nextBtn.addEventListener('click', playNext);
        shuffleBtn.addEventListener('click', toggleShuffle);
        repeatBtn.addEventListener('click', toggleRepeat);
        searchInput.addEventListener('input', filterSongs);

        // Initialize volume
        audioPlayer.volume = volumeSlider.value / 100;
    </script>
</body>
</html>
